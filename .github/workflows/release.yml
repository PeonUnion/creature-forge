# ============================================================================
# CreatureForge 跨平台二进制发布
# ----------------------------------------------------------------------------
# 触发：
#   - push tag v*（如 v0.3.0 / v0.3.1 / v0.4.0 / v1.0.0-rc.1）→ 构建 + GitHub Release
#   - workflow_dispatch（手动）→ 仅构建验证（不上传 Release）
#
# 版本语义（SemVer 2.0.0）：
#   - MAJOR.MINOR.PATCH 由 tag 决定（v*），workflow 不自动 bump
#   - 预发布后缀 -alpha/-beta/-rc → 自动标记为 GitHub Pre-release（预览版）
#   - 变更日志：Keep a Changelog（CHANGELOG.md），按 tag 提取对应版本块作为 Release Notes
#
# 产物（每平台）：
#   creature-forge-server-<ver>[.exe]  — HTTP server（嵌入 Vue 前端 + 物种数据）
#   creature-forge-cli-<ver>[.exe]     — 命令行工具（嵌入物种数据）
# ============================================================================

name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（如 0.3.0 或 0.3.0-rc.1；仅用于验证，不影响 tag）'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: '3.12'
            label: linux-x64
          - os: windows-latest
            py: '3.12'
            label: windows-x64
          - os: macos-14
            py: '3.12'
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      # 先装 pnpm（官方 action，读 packageManager pnpm@11.8.0），setup-node 的 cache: pnpm 才找得到
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: creatureforge/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: creatureforge/web
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Vue SPA → web/dist)
        working-directory: creatureforge/web
        run: pnpm build

      - name: Install pyinstaller
        run: pip install pyinstaller

      - name: Build server & cli binaries
        env:
          # 版本号：tag 触发用 tag（v*）；手动触发用输入值，默认 dev
          ASSETSLAB_VERSION: ${{ github.ref_name }}
          # 平台+架构后缀（保证三平台产物名不冲突）：linux-x64 / windows-x64 / macos-arm64
          ASSETSLAB_PLATFORM: ${{ matrix.label }}
        run: python scripts/build_release.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creature-forge-${{ matrix.label }}
          path: dist/creature-forge-*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：预发布（rc/beta/alpha）在 CHANGELOG 无条目时，用 git log 生成 commit 总结
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Generate release notes (from git log via gen_changelog.py)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # 结构化 Release Notes：Conventional Commits 按 tag 区间分组（Added/Fixed/Changed），无需维护 CHANGELOG
          python scripts/gen_changelog.py --tag "v${VER}" --raw > release-body.md 2>/dev/null || true
          if [ ! -s release-body.md ]; then
            # 兜底：纯 commit 列表（非 Conventional 提交 / 异常时）
            ref="v${VER}"
            prev="$(git describe --tags --abbrev=0 "$ref~1" 2>/dev/null || true)"
            rng="${prev:+$prev..}$ref"
            git log --no-merges --pretty=format:%s "$rng" | sed '/^$/d' | sed 's/^/- /' > release-body.md
          fi
          echo "Release body 行数: $(wc -l < release-body.md)"

      # 反复重推同 tag 会产生重复 release/draft → GitHub API 拒绝 update（already_exists）。
      # 创建前先删除同 tag 的全部 release 与 draft（保留 tag 本身），确保每次干净重建。
      - name: Delete existing releases for this tag (incl. drafts)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          base = f'https://api.github.com/repos/{repo}'
          h = {'Authorization': f'Bearer {token}',
               'Accept': 'application/vnd.github+json',
               'User-Agent': 'creature-forge'}
          try:
              req = urllib.request.Request(base + '/releases?per_page=100', headers=h)
              rels = json.load(urllib.request.urlopen(req))
          except Exception as e:
              print('list releases failed:', e)
              raise SystemExit(0)
          for r in rels:
              if r.get('tag_name') == tag:
                  rid = r['id']
                  try:
                      urllib.request.urlopen(urllib.request.Request(
                          f'{base}/releases/{rid}', method='DELETE', headers=h))
                      print(f'deleted release {rid} (draft={r.get("draft")})')
                  except Exception as e:
                      print(f'delete release {rid} failed: {e}')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/creature-forge-*
          body_path: release-body.md
          # SemVer 预发布后缀（-alpha/-beta/-rc）→ 标记为 Pre-release（预览版）
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
