# ============================================================================
# CreatureForge 跨平台二进制发布（Go 全量迁移版）
# ----------------------------------------------------------------------------
# 触发：
#   - push tag v*（如 v0.1.0 / v1.0.0-rc.1）→ 构建 + GitHub Release
#   - workflow_dispatch（手动）→ 仅构建验证（不上传 Release）
#
# 产物（每平台，Go 单二进制）：
#   creature-forge-server-<ver>-<platform>[.exe]  — HTTP server（//go:embed Vue 前端）
#   creature-forge-cli-<ver>-<platform>[.exe]     — 命令行工具（不含前端）
#
# 版本语义（SemVer 2.0.0）：tag v* 决定版本；预发布后缀 -alpha/-beta/-rc → Pre-release。
# Release Notes 由 git 历史自动生成（Conventional Commits 按 Added/Fixed/Changed 分组）。
# ============================================================================

name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（仅用于验证，不影响 tag）'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-x64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            label: windows-x64
            ext: '.exe'
          - os: macos-14
            goos: darwin
            goarch: arm64
            label: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: gocore/go.sum

      # 先装 pnpm（官方 action，读 packageManager pnpm@11.8.0）
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: creatureforge/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: creatureforge/web
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Vue SPA → web/dist)
        working-directory: creatureforge/web
        run: pnpm build

      - name: Sync frontend into Go embed (gocore/internal/server/static)
        shell: bash
        run: |
          STATIC="gocore/internal/server/static"
          rm -rf "$STATIC"
          mkdir -p "$STATIC"
          cp -r creatureforge/web/dist/. "$STATIC/"

      - name: Build Go binaries (server embed frontend / cli without)
        shell: bash
        env:
          VER: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.label }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          (cd gocore && go build -trimpath -o "../dist/creature-forge-server-${VER}-${PLATFORM}${{ matrix.ext }}" ./cmd/gocore-server)
          (cd gocore && go build -trimpath -o "../dist/creature-forge-cli-${VER}-${PLATFORM}${{ matrix.ext }}" ./cmd/gocore)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creature-forge-${{ matrix.label }}
          path: dist/creature-forge-*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Generate release notes (from git log, Conventional Commits)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}~1" 2>/dev/null || true)"
          rng="${prev:+$prev..}${GITHUB_REF_NAME}"
          {
            echo "## What's Changed"
            echo
            echo '### Added'
            git log --no-merges --pretty=format:%s "$rng" | grep -E '^feat' | sed 's/^/- /'
            echo
            echo '### Fixed'
            git log --no-merges --pretty=format:%s "$rng" | grep -E '^fix' | sed 's/^/- /'
            echo
            echo '### Changed'
            git log --no-merges --pretty=format:%s "$rng" | grep -E '^(refactor|perf|chore|docs|style|build)' | sed 's/^/- /'
          } > release-body.md
          if [ ! -s release-body.md ]; then
            git log --no-merges --pretty=format:%s "$rng" | sed '/^$/d' | sed 's/^/- /' > release-body.md
          fi
          echo "Release body 行数: $(wc -l < release-body.md)"

      - name: Delete existing releases for this tag (incl. drafts)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          base = f'https://api.github.com/repos/{repo}'
          h = {'Authorization': f'Bearer {token}',
               'Accept': 'application/vnd.github+json',
               'User-Agent': 'creature-forge'}
          try:
              req = urllib.request.Request(base + '/releases?per_page=100', headers=h)
              rels = json.load(urllib.request.urlopen(req))
          except Exception as e:
              print('list releases failed:', e)
              raise SystemExit(0)
          for r in rels:
              if r.get('tag_name') == tag:
                  rid = r['id']
                  try:
                      urllib.request.urlopen(urllib.request.Request(
                          f'{base}/releases/{rid}', method='DELETE', headers=h))
                      print(f'deleted release {rid} (draft={r.get("draft")})')
                  except Exception as e:
                      print(f'delete release {rid} failed: {e}')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/creature-forge-*
          body_path: release-body.md
          # SemVer 预发布后缀（-alpha/-beta/-rc）→ 标记为 Pre-release（预览版）
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
